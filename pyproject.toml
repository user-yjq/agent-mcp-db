[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-assistant-mcp"
version = "0.4.0"
description = "MCP 数据库助手：为 AI 编程工具提供 PostgreSQL / MySQL 的只读数据库能力（schema 上下文、只读查询、执行计划、安全网关）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "db-assistant team" }]
keywords = ["mcp", "postgresql", "mysql", "read-only", "ai"]
dependencies = [
    "mcp>=1.2.0,<2",
    "asyncpg>=0.29.0,<1",
    "aiomysql>=0.2.0,<1",
    "sqlglot>=25.0.0,<28",
    "typer>=0.12.0,<1",
    "prometheus-client>=0.20.0,<1",
    "aiohttp>=3.9.0,<4",
    "cryptography>=42.0.0,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<7",
    "ruff>=0.5.0,<1",
]

[project.scripts]
db-assistant = "db_assistant_mcp.cli.main:app"
db-assistant-mcp = "db_assistant_mcp.__main__:main"

[project.urls]
Repository = "https://example.invalid/db-assistant-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/db_assistant_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: 需要真实数据库（Docker PG/MySQL）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["db_assistant_mcp"]
omit = ["*/tests/*"]
